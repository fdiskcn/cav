name: ovrtx USD tests

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  usd:
    if: github.repository == 'fougue/mayo' || vars.MAYO_UPSTREAM_CI == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: ovrtx-usd-${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure, build and test (no Qt / OCCT / GPU)
      run: |
        cmake -S tests/ovrtx -B build-ovrtx-usd -DCMAKE_CXX_COMPILER=g++
        cmake --build build-ovrtx-usd
        ctest --test-dir build-ovrtx-usd --output-on-failure
